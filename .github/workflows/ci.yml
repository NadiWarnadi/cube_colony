name: Cube Colony CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Setup Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.22.0'

    - name: Install Active Linux Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libgtk-3-dev pkg-config

    - name: Install flutter_rust_bridge_codegen
      run: cargo install flutter_rust_bridge_codegen --version 2.1.0

    - name: Run Rust Code Generator
      run: flutter_rust_bridge_codegen generate

    - name: Run Rust Tests
      run: cd rust && cargo test

    - name: Run Flutter Analyze & Test
      run: |
        flutter pub get
        flutter analyze
